services:

  postgres:
    image: postgres:18.4-bookworm
    container_name: itk-testing-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - ${PROJECT_ROOT}/out/pgdata:/var/lib/postgresql
    restart: always

  postgres-migrate:
    image: migrate/migrate:v4.19.1
    container_name: itk-testing-postgres-migrate
    volumes:
      - ${PROJECT_ROOT}/migrations:/migrations
    depends_on:
      - postgres
    command:
      - -path
      - /migrations
      - -database
      - postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
      - up

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: itk-testing-app
    env_file:
      - config.env
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
    depends_on:
      - postgres-migrate
    ports:
      - "8080:8080"
    restart: always

  port-forwarder:
    image: alpine/socat:1.8.1.3
    container_name: itk-testing-port-forwarder
    command: tcp-listen:5432,fork,reuseaddr tcp-connect:postgres:5432
    ports:
      - "127.0.0.1:15432:5432"
    depends_on:
      - postgres